[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
barklog-audio = { path = "crates/barklog-audio" }
barklog-ml = { path = "crates/barklog-ml" }
barklog-core = { path = "crates/barklog-core" }
barklog-store = { path = "crates/barklog-store" }

symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "adpcm", "mkv", "caf"] }
realfft = "3.5"
safetensors = "0.8"
matrixmultiply = "0.3"
rayon = "1.12"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
indicatif = "0.18"
chrono = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1

# Нейросеть в debug-сборке работает в десятки раз медленнее
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.barklog-ml]
opt-level = 3
