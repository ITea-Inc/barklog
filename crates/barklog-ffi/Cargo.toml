[package]
name = "barklog-ffi"
description = "UniFFI-интерфейс BarkLog для Kotlin (Android) и Swift (iOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "barklog_ffi"
# cdylib — Android (.so), staticlib — iOS (.a), lib — тесты и генератор биндингов
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
barklog-audio.workspace = true
barklog-ml.workspace = true
barklog-core.workspace = true
barklog-store.workspace = true
thiserror.workspace = true
serde_json.workspace = true
uniffi.workspace = true

[dev-dependencies]
hound.workspace = true
half.workspace = true
